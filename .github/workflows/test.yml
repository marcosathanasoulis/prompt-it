name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate public package
        run: python3 scripts/validate_public_package.py
      - name: Compile validator
        run: python3 -m compileall -q scripts
